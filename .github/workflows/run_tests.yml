name: Tests
run-name: Running Tests
on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      AUTH_ALGORITHM: ${{ secrets.AUTH_ALGORITHM }}
      SQLALCHEMY_TEST_DATABASE_URL: ${{ secrets.SQLALCHEMY_TEST_DATABASE_URL }}
      SUPER_USER_USERNAME: ${{ secrets.SUPER_USER_USERNAME }}
      SUPER_USER_PASSWORD: ${{ secrets.SUPER_USER_PASSWORD }}
      SUPER_USER_EMAIL: ${{ secrets.SUPER_USER_EMAIL }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s app